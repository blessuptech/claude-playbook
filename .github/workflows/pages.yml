name: Deploy playbook to GitHub Pages

on:
  push:
    branches: [main]

# Allow this workflow to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; let in-progress runs finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject build-time footer values
        run: |
          LAST_UPDATED="$(git log -1 --format=%cd --date=format:%Y-%m-%d)"
          COMMIT_HASH="$(git rev-parse --short=7 HEAD)"
          sed -i "s/{{LAST_UPDATED}}/${LAST_UPDATED}/g" index.html
          sed -i "s/{{COMMIT_HASH}}/${COMMIT_HASH}/g" index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
